<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔羅牌抽牌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 0.95em;
        }

        .settings-section {
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-draw {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-draw:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .results-section {
            padding: 30px;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .result-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .result-header h2 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .question-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .question-display strong {
            color: #667eea;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .card-position {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .card-orientation {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-orientation.upright {
            background: #d4edda;
            color: #155724;
        }

        .card-orientation.reversed {
            background: #f8d7da;
            color: #721c24;
        }

        .card-description {
            color: #555;
            line-height: 1.8;
        }

        .summary {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #764ba2;
        }

        .summary h3 {
            color: #764ba2;
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        .summary p {
            color: #333;
            line-height: 1.8;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
            background: #f8f9fa;
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 1.5em;
            }

            .settings-section, .results-section {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .cards-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 塔羅牌抽牌</h1>
            <p>用於自我探索與學習的塔羅牌占卜工具</p>
        </header>

        <div class="settings-section">
            <div class="form-group">
                <label for="question">你的問題：</label>
                <textarea id="question" rows="3" placeholder="例如：關於工作發展的建議、感情狀況、財務規劃..."></textarea>
            </div>

            <div class="form-group">
                <label for="spread">選擇牌陣：</label>
                <select id="spread">
                    <option value="one">單張牌 - 今日重點/建議</option>
                    <option value="three-past-present-future">三張牌 - 過去/現在/未來走向</option>
                    <option value="three-situation-obstacle-advice">三張牌 - 現況/阻礙/建議</option>
                </select>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="reversal" checked>
                    <label for="reversal" style="margin-bottom: 0;">啟用逆位模式（每張牌 50% 機率為逆位）</label>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-draw" onclick="drawCards()">🎴 抽牌</button>
                <button class="btn-reset" onclick="resetAll()">🔄 重置</button>
            </div>
        </div>

        <div id="results" class="results-section">
            <div class="result-header">
                <h2>抽牌結果</h2>
            </div>
            <div id="result-content"></div>
        </div>

        <footer>
            <p>本工具僅供娛樂與自我探索，不保證事件結果。</p>
        </footer>
    </div>

    <script>
        // ============================================
        // 塔羅牌資料庫
        // ============================================

        const MAJOR_ARCANA = [
            {
                id: 0,
                name: "愚者 (The Fool)",
                upright_text: "新的開始、冒險精神、純真無畏。勇於踏出第一步，保持開放心態去探索未知。",
                reversed_text: "魯莽行事、缺乏計畫、逃避責任。需要更謹慎地評估風險，避免盲目前進。"
            },
            {
                id: 1,
                name: "魔術師 (The Magician)",
                upright_text: "創造力、技能、行動力。擁有實現目標的資源和能力，現在是展現才華的時刻。",
                reversed_text: "操控、欺騙、能力未發揮。可能被人誤導或自己無法善用現有資源。"
            },
            {
                id: 2,
                name: "女祭司 (The High Priestess)",
                upright_text: "直覺、內在智慧、神秘知識。傾聽內心聲音，答案在你的潛意識中。",
                reversed_text: "忽視直覺、秘密揭露、內在混亂。可能過度依賴理性而忽略了直覺的引導。"
            },
            {
                id: 3,
                name: "皇后 (The Empress)",
                upright_text: "豐盛、創造、母性關懷。生活中充滿豐富資源，是培育和成長的時期。",
                reversed_text: "依賴他人、創造力受阻、過度保護。需要重新建立獨立性和創造力。"
            },
            {
                id: 4,
                name: "皇帝 (The Emperor)",
                upright_text: "權威、結構、穩定。需要建立秩序和規則，以理性和組織來達成目標。",
                reversed_text: "專制、僵化、缺乏彈性。權威可能被濫用或過度控制造成問題。"
            },
            {
                id: 5,
                name: "教皇 (The Hierophant)",
                upright_text: "傳統、教導、精神指引。從傳統智慧和體制中尋找指引和支持。",
                reversed_text: "反叛、非傳統、獨立思考。可能需要突破傳統框架，找到自己的道路。"
            },
            {
                id: 6,
                name: "戀人 (The Lovers)",
                upright_text: "愛情、選擇、和諧。重要的關係或抉擇即將到來，需要傾聽內心真實感受。",
                reversed_text: "不和諧、錯誤選擇、價值觀衝突。關係中可能存在失衡或需要重新評估。"
            },
            {
                id: 7,
                name: "戰車 (The Chariot)",
                upright_text: "意志力、勝利、前進。通過自律和決心克服障礙，邁向成功。",
                reversed_text: "失去方向、缺乏控制、內在衝突。可能需要重新找回方向和動力。"
            },
            {
                id: 8,
                name: "力量 (Strength)",
                upright_text: "內在力量、勇氣、溫柔的掌控。用耐心和同情心而非蠻力來處理挑戰。",
                reversed_text: "自我懷疑、軟弱、內在恐懼。需要重建自信和內在的勇氣。"
            },
            {
                id: 9,
                name: "隱者 (The Hermit)",
                upright_text: "內省、尋找真理、獨處。需要退一步反思，從內在尋找答案。",
                reversed_text: "孤立、迷失、拒絕忠告。可能過度孤立自己或需要他人的支持。"
            },
            {
                id: 10,
                name: "命運之輪 (Wheel of Fortune)",
                upright_text: "變化、機遇、命運轉折。生命週期的轉變，接受變化並把握機會。",
                reversed_text: "厄運、阻力、失控。外在環境的變化帶來挑戰，需要適應和調整。"
            },
            {
                id: 11,
                name: "正義 (Justice)",
                upright_text: "公平、真相、因果。行為會有相應的結果，追求公正和平衡。",
                reversed_text: "不公、偏見、逃避責任。可能面臨不公平待遇或需要承擔後果。"
            },
            {
                id: 12,
                name: "吊人 (The Hanged Man)",
                upright_text: "暫停、新視角、犧牲。需要放慢腳步，從不同角度看待事物。",
                reversed_text: "拖延、抗拒、無謂犧牲。可能陷入停滯或需要採取行動。"
            },
            {
                id: 13,
                name: "死神 (Death)",
                upright_text: "轉變、結束、新生。舊的結束是為了新的開始，接受轉變。",
                reversed_text: "抗拒改變、停滯、無法放手。害怕改變而導致成長受阻。"
            },
            {
                id: 14,
                name: "節制 (Temperance)",
                upright_text: "平衡、和諧、中庸之道。保持耐心和節制，尋找中間道路。",
                reversed_text: "失衡、過度、缺乏耐心。生活某方面過度或失去平衡。"
            },
            {
                id: 15,
                name: "惡魔 (The Devil)",
                upright_text: "束縛、誘惑、物質執著。意識到自我限制，需要打破枷鎖。",
                reversed_text: "解脫、覺醒、打破束縛。開始擺脫不健康的依賴或模式。"
            },
            {
                id: 16,
                name: "塔 (The Tower)",
                upright_text: "突然改變、崩塌、啟示。舊結構的瓦解帶來重建的機會。",
                reversed_text: "避免災難、恐懼改變、內在動盪。可能推遲了必要的改變。"
            },
            {
                id: 17,
                name: "星星 (The Star)",
                upright_text: "希望、療癒、靈感。困難後的平靜，對未來充滿希望和信心。",
                reversed_text: "絕望、信心喪失、缺乏方向。需要重新找回希望和信念。"
            },
            {
                id: 18,
                name: "月亮 (The Moon)",
                upright_text: "幻覺、潛意識、不確定。事情可能不如表面所見，需要面對內心恐懼。",
                reversed_text: "真相揭露、克服恐懼、清晰。逐漸看清真相，走出迷霧。"
            },
            {
                id: 19,
                name: "太陽 (The Sun)",
                upright_text: "成功、喜悅、活力。充滿正能量和樂觀，一切順利進行。",
                reversed_text: "暫時挫折、過度樂觀、延遲。快樂可能被暫時遮蔽，但很快會回來。"
            },
            {
                id: 20,
                name: "審判 (Judgement)",
                upright_text: "覺醒、重生、內在召喚。評估過去並做出改變，回應內在的呼喚。",
                reversed_text: "自我懷疑、逃避責任、內在批判。可能過度批判自己或逃避面對。"
            },
            {
                id: 21,
                name: "世界 (The World)",
                upright_text: "完成、成就、圓滿。旅程的完成帶來成就感，準備迎接新階段。",
                reversed_text: "未完成、缺乏閉合、尋求完美。可能還有未完成的事或執著於完美。"
            }
        ];

        const SUITS = {
            wands: {
                name: "權杖",
                element: "火",
                keywords: "行動、創造、熱情",
                upright_template: "充滿熱情和行動力，積極追求目標。",
                reversed_template: "缺乏動力或過度衝動，需要調整行動方向。"
            },
            cups: {
                name: "聖杯",
                element: "水",
                keywords: "情感、關係、直覺",
                upright_template: "情感豐富，關係和諧，跟隨直覺。",
                reversed_template: "情感受阻或關係失衡，需要處理內在情緒。"
            },
            swords: {
                name: "寶劍",
                element: "風",
                keywords: "思考、挑戰、真相",
                upright_template: "清晰思考，面對挑戰，追求真相。",
                reversed_template: "思緒混亂或過度思考，需要理清頭緒。"
            },
            pentacles: {
                name: "錢幣",
                element: "土",
                keywords: "物質、實際、穩定",
                upright_template: "物質穩定，務實規劃，腳踏實地。",
                reversed_template: "財務或物質層面出現問題，需要重新評估。"
            }
        };

        const RANKS = {
            ace: { name: "王牌", number: "Ace" },
            two: { name: "二", number: "2" },
            three: { name: "三", number: "3" },
            four: { name: "四", number: "4" },
            five: { name: "五", number: "5" },
            six: { name: "六", number: "6" },
            seven: { name: "七", number: "7" },
            eight: { name: "八", number: "8" },
            nine: { name: "九", number: "9" },
            ten: { name: "十", number: "10" },
            page: { name: "侍者", number: "Page" },
            knight: { name: "騎士", number: "Knight" },
            queen: { name: "皇后", number: "Queen" },
            king: { name: "國王", number: "King" }
        };

        function generateMinorArcana() {
            const cards = [];
            let id = 22;

            for (const [suitKey, suit] of Object.entries(SUITS)) {
                for (const [rankKey, rank] of Object.entries(RANKS)) {
                    const name = `${suit.name}${rank.name} (${rank.number} of ${getSuitEnglishName(suitKey)})`;
                    
                    let uprightText = suit.upright_template;
                    let reversedText = suit.reversed_template;
                    
                    if (rankKey === 'ace') {
                        uprightText = `新的開始與潛能，${suit.keywords}的種子。${suit.upright_template}`;
                        reversedText = `錯失機會或新開始受阻。${suit.reversed_template}`;
                    } else if (['page', 'knight', 'queen', 'king'].includes(rankKey)) {
                        const courtMeanings = {
                            page: '學習者、訊息、新手的視角',
                            knight: '行動者、追求、動態能量',
                            queen: '成熟內化、培育、情感掌握',
                            king: '權威掌控、成熟外化、精通'
                        };
                        uprightText = `宮廷牌：${courtMeanings[rankKey]}。在${suit.keywords}層面上展現${rank.name}的特質。`;
                        reversedText = `${rank.name}特質的負面表現或能量不平衡。${suit.reversed_template}`;
                    } else {
                        const numberMeanings = {
                            two: '選擇、平衡、二元性',
                            three: '創造、成長、表達',
                            four: '穩定、基礎、休息',
                            five: '挑戰、衝突、變動',
                            six: '和諧、進展、調整',
                            seven: '評估、選擇、內省',
                            eight: '行動、移動、精通',
                            nine: '完成、實現、智慧',
                            ten: '圓滿、結束、轉變'
                        };
                        uprightText = `數字${rank.name}代表${numberMeanings[rankKey]}。在${suit.keywords}層面展現。${suit.upright_template}`;
                        reversedText = `${numberMeanings[rankKey]}的受阻或過度。${suit.reversed_template}`;
                    }

                    cards.push({
                        id: id++,
                        name: name,
                        suit: suitKey,
                        rank: rankKey,
                        upright_text: uprightText,
                        reversed_text: reversedText
                    });
                }
            }

            return cards;
        }

        function getSuitEnglishName(suitKey) {
            const names = {
                wands: 'Wands',
                cups: 'Cups',
                swords: 'Swords',
                pentacles: 'Pentacles'
            };
            return names[suitKey] || '';
        }

        const MINOR_ARCANA = generateMinorArcana();
        const FULL_DECK = [...MAJOR_ARCANA, ...MINOR_ARCANA];

        // ============================================
        // 牌陣定義
        // ============================================

        const SPREADS = {
            one: {
                name: "單張牌",
                positions: ["今日重點/建議"]
            },
            "three-past-present-future": {
                name: "三張牌 - 時間流",
                positions: ["過去", "現在", "未來走向"]
            },
            "three-situation-obstacle-advice": {
                name: "三張牌 - 問題解析",
                positions: ["現況", "阻礙", "建議"]
            }
        };

        // ============================================
        // Fisher-Yates 洗牌演算法
        // ============================================

        function shuffleDeck(deck) {
            const shuffled = [...deck];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // ============================================
        // 抽牌邏輯
        // ============================================

        function drawCards() {
            const question = document.getElementById('question').value.trim();
            const spreadType = document.getElementById('spread').value;
            const useReversal = document.getElementById('reversal').checked;

            const spread = SPREADS[spreadType];
            const cardCount = spread.positions.length;

            // 洗牌並抽取
            const shuffled = shuffleDeck(FULL_DECK);
            const drawnCards = shuffled.slice(0, cardCount);

            // 決定正逆位
            const results = drawnCards.map((card, index) => {
                const isReversed = useReversal && Math.random() < 0.5;
                return {
                    position: spread.positions[index],
                    card: card,
                    reversed: isReversed
                };
            });

            displayResults(question, spread.name, results);
        }

        // ============================================
        // 顯示結果
        // ============================================

        function displayResults(question, spreadName, results) {
            const resultSection = document.getElementById('results');
            const resultContent = document.getElementById('result-content');

            let html = '';

            // 顯示問題
            if (question) {
                html += `
                    <div class="question-display">
                        <strong>你的問題：</strong>${escapeHtml(question)}
                    </div>
                `;
            }

            // 顯示牌陣名稱
            html += `<p style="text-align: center; color: #666; margin-bottom: 20px;">使用牌陣：${spreadName}</p>`;

            // 顯示卡片
            html += '<div class="cards-container">';
            results.forEach(result => {
                const orientationClass = result.reversed ? 'reversed' : 'upright';
                const orientationText = result.reversed ? '逆位' : '正位';
                const description = result.reversed ? result.card.reversed_text : result.card.upright_text;

                html += `
                    <div class="card">
                        <div class="card-position">${escapeHtml(result.position)}</div>
                        <div class="card-name">${escapeHtml(result.card.name)}</div>
                        <div class="card-orientation ${orientationClass}">${orientationText}</div>
                        <div class="card-description">${escapeHtml(description)}</div>
                    </div>
                `;
            });
            html += '</div>';

            // 生成總結
            const summary = generateSummary(results);
            html += `
                <div class="summary">
                    <h3>整體解讀</h3>
                    ${summary}
                </div>
            `;

            resultContent.innerHTML = html;
            resultSection.classList.add('show');

            // 滾動到結果區
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ============================================
        // 生成總結
        // ============================================

        function generateSummary(results) {
            const majorCount = results.filter(r => r.card.id < 22).length;
            const minorCount = results.length - majorCount;
            const reversedCount = results.filter(r => r.reversed).length;

            const suitCounts = {
                wands: 0,
                cups: 0,
                swords: 0,
                pentacles: 0
            };

            results.forEach(r => {
                if (r.card.suit) {
                    suitCounts[r.card.suit]++;
                }
            });

            let summary = '<p>';

            // 大小牌分析
            if (majorCount > 0 && minorCount > 0) {
                summary += `這次抽牌包含 ${majorCount} 張大牌與 ${minorCount} 張小牌。`;
                if (majorCount > minorCount) {
                    summary += '大牌較多，表示這個問題涉及重要的人生課題或轉折點，具有深遠影響。';
                } else {
                    summary += '小牌較多，表示這個問題更偏向日常生活層面的具體事件。';
                }
            } else if (majorCount === results.length) {
                summary += '全部為大牌，這是一個極具深度的重要時刻，涉及人生重大主題。';
            } else {
                summary += '全部為小牌，這個問題主要關注日常生活的實際面向。';
            }

            // 花色分析
            const dominantSuit = Object.keys(suitCounts).reduce((a, b) => 
                suitCounts[a] > suitCounts[b] ? a : b
            );

            if (minorCount > 0 && suitCounts[dominantSuit] >= 2) {
                const suit = SUITS[dominantSuit];
                summary += ` ${suit.name}的出現較多，強調${suit.keywords}的重要性。`;
            }

            // 正逆位分析
            if (reversedCount > 0) {
                summary += ` 有 ${reversedCount} 張逆位牌，提醒你注意受阻的能量或需要調整的面向。`;
            }

            summary += '</p>';

            // 建議
            summary += '<p><strong>下一步建議：</strong>';
            if (reversedCount > results.length / 2) {
                summary += '目前有較多能量受阻，建議先暫緩行動，調整心態和方法後再前進。';
            } else if (majorCount > minorCount) {
                summary += '這是重要的轉折點，建議深入思考並做出對長遠有益的選擇。';
            } else {
                summary += '專注於具體行動和日常實踐，一步一步實現目標。';
            }
            summary += '</p>';

            return summary;
        }

        // ============================================
        // 重置功能
        // ============================================

        function resetAll() {
            document.getElementById('question').value = '';
            document.getElementById('spread').value = 'one';
            document.getElementById('reversal').checked = true;
            
            const resultSection = document.getElementById('results');
            resultSection.classList.remove('show');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================
        // 安全性：HTML 轉義
        // ============================================

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // 初始化
        // ============================================

        console.log('塔羅牌抽牌系統已載入');
        console.log(`牌庫：${FULL_DECK.length} 張牌（大牌 ${MAJOR_ARCANA.length} + 小牌 ${MINOR_ARCANA.length}）`);
    </script>
</body>
</html>
