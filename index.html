<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔羅牌抽牌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 0.95em;
        }

        .settings-section {
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-draw {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-draw:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .results-section {
            padding: 30px;
            display: none;
        }

        .results-section.show {
            display: block;
        }

        .result-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .result-header h2 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .question-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .question-display strong {
            color: #667eea;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .card-position {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .card-orientation {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-orientation.upright {
            background: #d4edda;
            color: #155724;
        }

        .card-orientation.reversed {
            background: #f8d7da;
            color: #721c24;
        }

        .card-description {
            color: #555;
            line-height: 1.8;
        }

        .summary {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-radius: 12px;
            border-left: 5px solid #764ba2;
        }

        .summary h3 {
            color: #764ba2;
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        .summary p {
            color: #333;
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .summary-section h4 {
            color: #667eea;
            font-size: 1.1em;
            margin: 20px 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #e9ecef;
        }

        .summary-section h4:first-child {
            margin-top: 0;
        }

        .summary-section p {
            margin-bottom: 12px;
        }

        .advice-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #667eea;
        }

        .advice-box p {
            margin-bottom: 15px;
        }

        .advice-box p:last-child {
            margin-bottom: 0;
        }

        .closing-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .closing-message p {
            margin: 0;
            font-size: 1.05em;
            line-height: 1.8;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
            background: #f8f9fa;
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 1.5em;
            }

            .settings-section, .results-section {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .cards-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 塔羅牌抽牌</h1>
            <p>用於自我探索與學習的塔羅牌占卜工具</p>
        </header>

        <div class="settings-section">
            <div class="form-group">
                <label for="question">你的問題：</label>
                <textarea id="question" rows="3" placeholder="例如：關於工作發展的建議、感情狀況、財務規劃..."></textarea>
            </div>

            <div class="form-group">
                <label for="spread">選擇牌陣：</label>
                <select id="spread">
                    <option value="one">單張牌 - 今日重點/建議</option>
                    <option value="three-past-present-future">三張牌 - 過去/現在/未來走向</option>
                    <option value="three-situation-obstacle-advice">三張牌 - 現況/阻礙/建議</option>
                </select>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="reversal" checked>
                    <label for="reversal" style="margin-bottom: 0;">啟用逆位模式（每張牌 50% 機率為逆位）</label>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-draw" onclick="drawCards()">🎴 抽牌</button>
                <button class="btn-reset" onclick="resetAll()">🔄 重置</button>
            </div>
        </div>

        <div id="results" class="results-section">
            <div class="result-header">
                <h2>抽牌結果</h2>
            </div>
            <div id="result-content"></div>
        </div>

        <footer>
            <p>本工具僅供娛樂與自我探索，不保證事件結果。</p>
        </footer>
    </div>

    <script>
        // ============================================
        // 塔羅牌資料庫
        // ============================================

        const MAJOR_ARCANA = [
            {
                id: 0,
                name: "愚者 (The Fool)",
                upright_text: "新的開始、冒險精神、純真無畏。勇於踏出第一步，保持開放心態去探索未知。這是一個充滿可能性的時刻，放下既有的框架和恐懼，以初學者的心態面對新的旅程。信任直覺，讓好奇心引領你前進。",
                reversed_text: "魯莽行事、缺乏計畫、逃避責任。需要更謹慎地評估風險，避免盲目前進。可能因為過度樂觀而忽略了現實考量，或是害怕承擔後果而一再拖延。建議先做好基本準備，建立清晰的目標和計畫。"
            },
            {
                id: 1,
                name: "魔術師 (The Magician)",
                upright_text: "創造力、技能、行動力。擁有實現目標的資源和能力，現在是展現才華的時刻。你手中握有所有必要的工具和技能，關鍵在於如何運用它們。專注於目標，結合意志力和實際行動，你能夠將想法轉化為現實。",
                reversed_text: "操控、欺騙、能力未發揮。可能被人誤導或自己無法善用現有資源。才能被浪費或用於不當目的，或是缺乏自信而不敢展現實力。建議重新審視自己的動機，誠實面對自己的能力和限制。"
            },
            {
                id: 2,
                name: "女祭司 (The High Priestess)",
                upright_text: "直覺、內在智慧、神秘知識。傾聽內心聲音，答案在你的潛意識中。這是一個需要安靜內省的時刻，表面之下隱藏著更深層的真相。相信你的第六感，通過冥想和反思來接收內在的指引。",
                reversed_text: "忽視直覺、秘密揭露、內在混亂。可能過度依賴理性而忽略了直覺的引導。內心的聲音被外在的噪音掩蓋，或是隱藏的事實即將浮現。建議重新建立與內在自我的連結，花時間靜心聆聽。"
            },
            {
                id: 3,
                name: "皇后 (The Empress)",
                upright_text: "豐盛、創造、母性關懷。生活中充滿豐富資源，是培育和成長的時期。這是收穫和豐饒的時刻，你的創造力和養育能力正處於巔峰。好好照顧自己和周圍的人，享受生命的美好和富足。",
                reversed_text: "依賴他人、創造力受阻、過度保護。需要重新建立獨立性和創造力。可能過度依賴他人支持，或是將全部精力投注在照顧他人而忽略自己。建議找回內在的創造力，學會在給予和接受之間取得平衡。"
            },
            {
                id: 4,
                name: "皇帝 (The Emperor)",
                upright_text: "權威、結構、穩定。需要建立秩序和規則，以理性和組織來達成目標。這是建立穩固基礎的時刻，運用邏輯思維和策略規劃來掌控局面。設定清晰的界限和目標，以領導者的姿態負起責任。",
                reversed_text: "專制、僵化、缺乏彈性。權威可能被濫用或過度控制造成問題。可能過度控制導致關係緊張，或是在該展現權威時卻軟弱無力。建議在堅持原則和保持彈性之間找到平衡，學習以同理心領導。"
            },
            {
                id: 5,
                name: "教皇 (The Hierophant)",
                upright_text: "傳統、教導、精神指引。從傳統智慧和體制中尋找指引和支持。這是向有經驗的導師學習的時刻，尊重既有的規範和傳統能帶來穩定和指引。尋求精神上的成長，參與能提供意義感的團體或儀式。",
                reversed_text: "反叛、非傳統、獨立思考。可能需要突破傳統框架，找到自己的道路。舊有的信念系統不再適用，或是感到被傳統束縛。建議質疑權威，發展自己的價值觀和信念，但也要避免為了反叛而反叛。"
            },
            {
                id: 6,
                name: "戀人 (The Lovers)",
                upright_text: "愛情、選擇、和諧。重要的關係或抉擇即將到來，需要傾聽內心真實感受。這是深層連結和重要選擇的時刻，無論是愛情關係或人生決定，都需要你真誠地面對內心的渴望。選擇與你價值觀一致的道路。",
                reversed_text: "不和諧、錯誤選擇、價值觀衝突。關係中可能存在失衡或需要重新評估。內心的矛盾和外在的壓力讓你難以做出決定，或是關係中出現了信任和溝通的問題。建議先釐清自己的價值觀，誠實面對真實感受。"
            },
            {
                id: 7,
                name: "戰車 (The Chariot)",
                upright_text: "意志力、勝利、前進。通過自律和決心克服障礙，邁向成功。這是展現決心和行動力的時刻，即使面對挑戰也要保持專注和自信。掌握方向盤，用堅定的意志力駕馭人生，勝利就在前方。",
                reversed_text: "失去方向、缺乏控制、內在衝突。可能需要重新找回方向和動力。內在的矛盾力量互相拉扯，導致進展停滯。可能過度激進或完全失去動力。建議重新審視目標，整合內在的衝突能量，找回前進的動力。"
            },
            {
                id: 8,
                name: "力量 (Strength)",
                upright_text: "內在力量、勇氣、溫柔的掌控。用耐心和同情心而非蠻力來處理挑戰。真正的力量來自內在的平靜和自信，以溫柔而堅定的方式面對困難。相信自己的能力，用愛和理解而非強制來影響周圍的環境。",
                reversed_text: "自我懷疑、軟弱、內在恐懼。需要重建自信和內在的勇氣。可能被恐懼和自我懷疑所控制，或是用錯誤的方式展現力量。建議重新連結內在的勇氣，學習在溫柔和堅強之間找到平衡。"
            },
            {
                id: 9,
                name: "隱者 (The Hermit)",
                upright_text: "內省、尋找真理、獨處。需要退一步反思，從內在尋找答案。這是向內探索的時刻，暫時遠離喧囂以尋找更深層的智慧。通過獨處和反思，你將發現內在的光芒。這段孤獨的旅程會帶來重要的自我認識。",
                reversed_text: "孤立、迷失、拒絕忠告。可能過度孤立自己或需要他人的支持。過度隱遁導致與世界脫節，或是害怕獨處而逃避自我反思。建議在獨處和社交之間找到平衡，必要時尋求他人的指引和支持。"
            },
            {
                id: 10,
                name: "命運之輪 (Wheel of Fortune)",
                upright_text: "變化、機遇、命運轉折。生命週期的轉變，接受變化並把握機會。生命正在轉動，帶來新的機遇和可能性。這是命運轉折的時刻，順應宇宙的節奏，把握隨之而來的好運和成長機會。",
                reversed_text: "厄運、阻力、失控。外在環境的變化帶來挑戰，需要適應和調整。命運之輪逆轉，帶來意外的挑戰和阻礙。雖然無法控制外在變化，但你可以選擇如何回應。建議接受現況，在逆境中尋找學習和成長的機會。"
            },
            {
                id: 11,
                name: "正義 (Justice)",
                upright_text: "公平、真相、因果。行為會有相應的結果，追求公正和平衡。這是因果法則發揮作用的時刻，你的過去行為將帶來相應的結果。誠實面對真相，做出公正的判斷。保持客觀和公平，為自己的選擇負責。",
                reversed_text: "不公、偏見、逃避責任。可能面臨不公平待遇或需要承擔後果。可能遭遇不公平的對待，或是自己的偏見影響了判斷。逃避該承擔的責任只會讓問題惡化。建議誠實面對自己的行為，尋求真正的公正和平衡。"
            },
            {
                id: 12,
                name: "吊人 (The Hanged Man)",
                upright_text: "暫停、新視角、犧牲。需要放慢腳步，從不同角度看待事物。這是暫停和反思的時刻，看似被動的等待實則蘊含深刻的轉變。換個角度看待困境，你會發現新的理解。有時候放手和接受比強行掙扎更有智慧。",
                reversed_text: "拖延、抗拒、無謂犧牲。可能陷入停滯或需要採取行動。可能為了錯誤的理由而犧牲，或是抗拒必要的等待期。拖延決定或行動反而讓情況惡化。建議分辨哪些是有意義的等待，哪些是需要改變的停滯。"
            },
            {
                id: 13,
                name: "死神 (Death)",
                upright_text: "轉變、結束、新生。舊的結束是為了新的開始，接受轉變。這是深刻轉變的時刻，某個階段或模式正在結束，為新的成長騰出空間。雖然結束可能令人不安，但這是生命週期的自然部分。擁抱轉變，迎接重生。",
                reversed_text: "抗拒改變、停滯、無法放手。害怕改變而導致成長受阻。緊抓著已經不再適合的人事物，害怕改變導致停滯不前。拒絕放手只會延長痛苦。建議接受變化的必然性，勇敢地釋放過去，為新的可能性騰出空間。"
            },
            {
                id: 14,
                name: "節制 (Temperance)",
                upright_text: "平衡、和諧、中庸之道。保持耐心和節制，尋找中間道路。這是調和與整合的時刻，在對立的力量之間找到平衡點。保持耐心，採取漸進的方式，避免極端。透過調和不同元素，創造出和諧的狀態。",
                reversed_text: "失衡、過度、缺乏耐心。生活某方面過度或失去平衡。可能在某方面過度放縱或過度限制，失去了中庸之道。缺乏耐心導致急躁行事。建議重新審視生活各個面向，找回內在和外在的平衡。"
            },
            {
                id: 15,
                name: "惡魔 (The Devil)",
                upright_text: "束縛、誘惑、物質執著。意識到自我限制，需要打破枷鎖。這張牌揭示你可能被欲望、成癮或不健康的模式所束縛。重要的是認識到這些鎖鏈大多是自我設限。覺察是解脫的第一步，你比自己想像的更有力量打破這些束縛。",
                reversed_text: "解脫、覺醒、打破束縛。開始擺脫不健康的依賴或模式。你正在覺醒，開始看清那些限制你的模式和依賴。這是掙脫枷鎖、重獲自由的時刻。繼續保持覺察，勇敢地做出改變，不要再讓恐懼控制你。"
            },
            {

        function getSuitEnglishName(suitKey) {
            const names = {

            };

        }

        const MINOR_ARCANA = generateMinorArcana();
        const FULL_DECK = [...MAJOR_ARCANA, ...MINOR_ARCANA];

        // ============================================

        const SPREADS = {

            }
        };

        // ============================================
        // Fisher-Yates 洗牌演算法
        // ============================================

        function shuffleDeck(deck) {
            const shuffled = [...deck];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // ============================================
        // 抽牌邏輯
        // ============================================

        function drawCards() {
            const question = document.getElementById('question').value.trim();
            const spreadType = document.getElementById('spread').value;
            const useReversal = document.getElementById('reversal').checked;

            const spread = SPREADS[spreadType];
            const cardCount = spread.positions.length;

            // 洗牌並抽取
            const shuffled = shuffleDeck(FULL_DECK);
            const drawnCards = shuffled.slice(0, cardCount);

            // 決定正逆位
            const results = drawnCards.map((card, index) => {
                const isReversed = useReversal && Math.random() < 0.5;
                return {
                    position: spread.positions[index],
                    card: card,
                    reversed: isReversed
                };
            });

            displayResults(question, spread.name, results);
        }

            const resultSection = document.getElementById('results');

            // 顯示卡片
            html += '<div class="cards-container">';
            results.forEach(result => {
                const orientationClass = result.reversed ? 'reversed' : 'upright';
                const orientationText = result.reversed ? '逆位' : '正位';
                const description = result.reversed ? result.card.reversed_text : result.card.upright_text;

                html += `
                    <div class="card">
                        <div class="card-position">${escapeHtml(result.position)}</div>
                        <div class="card-name">${escapeHtml(result.card.name)}</div>
                        <div class="card-orientation ${orientationClass}">${orientationText}</div>
                        <div class="card-description">${escapeHtml(description)}</div>

            html += '</div>';

            // 生成總結

            html += `

                    <h3>整體解讀</h3>
                    ${summary}
                </div>
            `;

            resultSection.classList.add('show');

            // 滾動到結果區
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

                        advicePoints.push('<strong>情感建議：</strong>誠實面對和表達你的感受。如果涉及人際關係，主動溝通和傾聽。照顧好自己的情緒健康，必要時尋求支持。相信直覺的指引。');
                    } else if (dominantSuit === 'swords') {
                        advicePoints.push('<strong>思考建議：</strong>收集資訊，理性分析，但避免過度思考導致行動癱瘓。用文字記錄想法能幫助釐清思緒。必要時尋求專業意見或第三方視角。');
                    } else if (dominantSuit === 'pentacles') {
                        advicePoints.push('<strong>實務建議：</strong>檢視財務狀況和物質資源，做好預算和規劃。投資時間在能帶來長期價值的事物上。保持耐心，穩定地建立基礎比快速擴張更重要。');
                    }
                }
            }
            
            // 整合性建議
            if (results.length === 3) {
                advicePoints.push('<strong>整合三張牌的訊息：</strong>將三個位置的牌義串連起來理解。第一張牌揭示根源或過去影響，第二張牌顯示當前狀態或挑戰，第三張牌指向結果或需要採取的方向。它們共同講述一個完整的故事。');
            }
            
            advicePoints.forEach(point => {
                summary += `<p>${point}</p>`;
            });
            
            summary += '</div>';

            // 4. 結語
            summary += '<div class="closing-message"><p>';
            if (reversedCount > results.length * 0.6) {
                summary += '記住，逆位牌不是壞消息，而是<strong>需要內在調整的提示</strong>。這段時期適合深度反思和準備，為未來的順暢發展奠定基礎。保持耐心和覺察。';
            } else {
                summary += '塔羅牌提供的是<strong>指引而非命定</strong>。你永遠有選擇的自由。用這些洞察來幫助決策，但最終答案在你心中。相信自己的智慧，勇敢前行。';
            }
            summary += '</p></div>';

            summary += '</div>';

            return summary;
        }

        // ============================================
        // 重置功能
        // ============================================

        function resetAll() {
            document.getElementById('question').value = '';
            document.getElementById('spread').value = 'one';
            document.getElementById('reversal').checked = true;
            
            const resultSection = document.getElementById('results');
            resultSection.classList.remove('show');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================
        // 安全性：HTML 轉義
        // ============================================

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // 初始化
        // ============================================

        console.log('塔羅牌抽牌系統已載入');
        console.log(`牌庫：${FULL_DECK.length} 張牌（大牌 ${MAJOR_ARCANA.length} + 小牌 ${MINOR_ARCANA.length}）`);
    </script>
